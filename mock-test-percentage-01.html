<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F2A4A">
<meta name="color-scheme" content="light">
<title>Mock Test 1 · Percentage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2A4A; --navy-deep:#0A1E38; --teal:#0EA5A0; --teal-light:#E6F7F6;
  --amber:#F0A93A; --red:#E1523F; --green:#1FA971; --purple:#7A4FD6;
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#122036; --ink-soft:#5A6B82; --line:#E3E8EF;
  --radius:14px; --radius-sm:8px;
  --shadow:0 2px 10px rgba(15,42,74,0.07); --shadow-lg:0 10px 30px rgba(15,42,74,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Noto Sans Devanagari','Poppins',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;}
h1,h2,h3,h4{font-family:'Poppins','Noto Sans Devanagari',sans-serif;margin:0;color:var(--navy);}
p{line-height:1.7;margin:0 0 10px 0;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

.wm-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;opacity:0.06;}
.wm-layer span{position:absolute;white-space:nowrap;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:#0F2A4A;transform:rotate(-28deg);letter-spacing:1px;}

#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:24px;}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
.topbar .tb-txt{flex:1;min-width:0;}
.topbar .title{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .sub{font-size:11px;opacity:0.75;}
.q-timer{background:rgba(255,255,255,0.14);color:#fff;padding:7px 13px;border-radius:20px;font-weight:700;font-size:14px;font-family:'Poppins',sans-serif;letter-spacing:0.5px;flex-shrink:0;}
.q-timer.low{background:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.55;}100%{opacity:1;}}

.view{padding:16px;}

/* Intro */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#133a63 55%,var(--teal) 160%);color:#fff;border-radius:var(--radius);padding:24px 20px;position:relative;overflow:hidden;}
.hero .badge{display:inline-block;background:rgba(255,255,255,0.16);border-radius:20px;padding:4px 12px;font-size:11.5px;font-weight:600;margin-bottom:10px;}
.hero h1{color:#fff;font-size:24px;font-weight:800;}
.hero .tag{color:#CFE8FF;font-size:13px;margin-top:6px;}
.intro-stats{display:flex;gap:10px;margin:14px 0;}
.intro-stat{background:var(--teal-light);border-radius:10px;padding:12px 6px;flex:1;text-align:center;}
.intro-stat b{display:block;font-size:19px;color:var(--navy);font-family:'Poppins',sans-serif;}
.intro-stat span{font-size:11px;color:var(--ink-soft);}
.card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-top:14px;}
.card h3{font-size:14.5px;margin-bottom:8px;}
.rules{margin:0;padding-left:18px;font-size:12.8px;color:#2B3B52;}
.rules li{margin-bottom:6px;line-height:1.6;}
.sec-list .sl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.sec-list .sl:last-child{border:none;}
.sec-list .sl b{color:var(--teal);}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--ink-soft);}
.legend i{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-4px;margin-right:5px;}
.start-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:15px;margin-top:16px;}

/* Section tabs */
.sec-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:40;-webkit-overflow-scrolling:touch;}
.sec-tab{flex:1;min-width:150px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;color:var(--ink-soft);}
.sec-tab b{display:block;font-size:12.5px;color:var(--navy);}
.sec-tab span{font-size:11px;}
.sec-tab.active{border-color:var(--teal);background:var(--teal-light);}
.sec-tab.active b{color:var(--teal);}

/* Question */
.quiz-body{padding:14px 16px 0;}
.q-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.q-progress{font-size:12.5px;font-weight:700;color:var(--navy);}
.q-marks{font-size:11px;font-weight:600;color:var(--ink-soft);}
.q-marks .p{color:var(--green);} .q-marks .n{color:var(--red);}
.flag-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;}
.flag-chip.on{background:var(--purple);border-color:var(--purple);color:#fff;}
.q-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.q-text{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.65;margin-bottom:14px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:13.5px;line-height:1.5;background:#fff;cursor:pointer;}
.opt .opt-letter{width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--ink-soft);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.opt.selected{border-color:var(--teal);background:var(--teal-light);}
.opt.selected .opt-letter{background:var(--teal);color:#fff;}
.opt.correct{border-color:var(--green);background:#EAFBF3;}
.opt.correct .opt-letter{background:var(--green);color:#fff;}
.opt.wrong{border-color:var(--red);background:#FDECEA;}
.opt.wrong .opt-letter{background:var(--red);color:#fff;}
.hint{font-size:11.5px;color:#8A5A00;background:#FFF6E6;border-radius:8px;padding:7px 10px;margin-top:2px;}
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.act-grid.two{grid-template-columns:1fr 1fr;}
.abtn{border:none;border-radius:10px;padding:12px 6px;font-weight:700;font-size:12.5px;}
.a-prev{background:#fff;color:var(--navy);border:1px solid var(--line) !important;}
.a-skip{background:#fff;color:var(--ink-soft);border:1px solid var(--line) !important;}
.a-clear{background:#FDECEA;color:var(--red);}
.a-mark{background:#EFE8FB;color:var(--purple);}
.a-save{background:var(--navy);color:#fff;}

/* Palette */
.palette-wrap{margin-top:16px;background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.palette-wrap h4{font-size:13.5px;margin-bottom:10px;}
.psec{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:10px 0 6px;}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.pbtn{position:relative;height:40px;border-radius:9px;border:1.5px solid var(--line);background:#EEF1F5;color:var(--ink-soft);font-weight:700;font-size:13px;font-family:'Poppins',sans-serif;}
.pbtn.notans{background:#FDECEA;border-color:var(--red);color:var(--red);}
.pbtn.ans{background:var(--green);border-color:var(--green);color:#fff;}
.pbtn.mark{background:var(--purple);border-color:var(--purple);color:#fff;border-radius:50%;}
.pbtn.markans{background:var(--purple);border-color:var(--purple);color:#fff;border-radius:50%;}
.pbtn.markans::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #fff;}
.pbtn.cur{outline:3px solid var(--amber);outline-offset:1px;}
.submit-btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:var(--red);color:#fff;font-weight:800;font-size:14.5px;}

/* Modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,30,56,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 24px;}
.modal h3{font-size:17px;margin-bottom:12px;}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.sum-item{background:var(--bg);border-radius:10px;padding:10px;text-align:center;}
.sum-item b{display:block;font-size:19px;font-family:'Poppins',sans-serif;color:var(--navy);}
.sum-item span{font-size:11px;color:var(--ink-soft);}
.m-row{display:flex;gap:10px;}
.m-row button{flex:1;padding:13px;border-radius:11px;border:none;font-weight:700;font-size:13.5px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;z-index:300;box-shadow:var(--shadow-lg);max-width:88%;text-align:center;}

/* Result */
.score-hero{background:linear-gradient(135deg,var(--navy) 0%,#133a63 60%,var(--teal) 170%);color:#fff;border-radius:var(--radius);padding:24px 18px;text-align:center;}
.score-hero .lbl{font-size:12.5px;color:#CFE8FF;}
.score-hero .big{font-family:'Poppins',sans-serif;font-size:44px;font-weight:800;line-height:1.1;margin:6px 0;}
.score-hero .big small{font-size:18px;opacity:0.8;font-weight:600;}
.score-hero .msg{font-size:13px;color:#EAF2FF;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.stat{background:#fff;border-radius:12px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);}
.stat b{display:block;font-size:19px;font-family:'Poppins',sans-serif;}
.stat span{font-size:11px;color:var(--ink-soft);}
.stat.g b{color:var(--green);} .stat.r b{color:var(--red);} .stat.t b{color:var(--teal);} .stat.n b{color:var(--navy);} .stat.a b{color:var(--amber);}
.mini-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.mini-table th,.mini-table td{border:1px solid var(--line);padding:8px 6px;text-align:center;}
.mini-table th{background:var(--navy);color:#fff;font-weight:600;}
.mini-table td:first-child{text-align:left;}
.res-btns{display:flex;gap:10px;margin-top:16px;}
.res-btns button{flex:1;padding:13px;border-radius:11px;border:none;font-weight:700;font-size:13.5px;}
.btn-navy{background:var(--navy);color:#fff;} .btn-teal{background:var(--teal-light);color:var(--teal);}
.filters{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px;}
.fchip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;white-space:nowrap;}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff;}
.rv-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:700;}
.tagx{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.tagx.c{background:#EAFBF3;color:var(--green);} .tagx.w{background:#FDECEA;color:var(--red);} .tagx.s{background:#EEF1F5;color:var(--ink-soft);}
.note-box{background:#FFF6E6;border-left:4px solid var(--amber);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:12.8px;color:#5A4210;line-height:1.65;}
.opt.static{cursor:default;}
.q-text{white-space:pre-line;}
.pyq{display:inline-block;background:#FFF6E6;color:#8A5A00;border-radius:8px;padding:2px 9px;font:700 11px Poppins,sans-serif;margin-bottom:8px;white-space:normal;}

.lang-toggle{background:rgba(255,255,255,0.16);color:#fff;border:none;border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px;flex-shrink:0;}
.lang-card{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow);cursor:pointer;}
.lang-card:active{border-color:var(--teal);background:var(--teal-light);}
.lang-ico{width:48px;height:48px;border-radius:12px;background:var(--teal-light);color:var(--teal);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Noto Sans Devanagari','Poppins',sans-serif;}
.lang-card b{display:block;font-size:17px;color:var(--navy);}
.lang-card span{font-size:12px;color:var(--ink-soft);}
.lang-card em{margin-left:auto;font-style:normal;color:var(--teal);font-size:16px;}

/* RESPONSIVE */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--tb:58px;--tabs:56px}
body{min-height:100vh;min-height:100dvh}
#app{min-height:100vh;min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.topbar{padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec-tabs{top:var(--tb)}
.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#view-lang,#view-intro,#view-result,#view-review{max-width:780px;margin-left:auto;margin-right:auto}
button{touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (hover:hover){
 .opt:not(.static):hover{border-color:var(--teal)}
 .lang-card:hover{border-color:var(--teal);background:var(--teal-light)}
 .abtn:hover,.pbtn:hover,.fchip:hover,.flag-chip:hover,.lang-toggle:hover{filter:brightness(.95)}
 .start-btn:hover,.submit-btn:hover,.a-save:hover,.res-btns button:hover,.m-row button:hover{filter:brightness(1.08)}
}
/* tablet */
@media (min-width:600px){
 #app{max-width:780px}
 .view{padding:24px}
 .quiz-body{padding:18px 24px 0}
 .sec-tabs{padding:10px 24px}
 .hero{padding:30px 26px}.hero h1{font-size:28px}
 .intro-stat b{font-size:22px}.rules{font-size:14px}.sec-list .sl{font-size:14px}.legend{font-size:12.5px}
 .q-text{font-size:17px}
 .opt{font-size:15px;padding:14px}.opt .opt-letter{width:28px;height:28px;font-size:13px}
 .abtn{padding:14px 8px;font-size:14px}
 .pgrid{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:10px}.pbtn{height:44px}
 .modal-bg{align-items:center}.modal{border-radius:20px;max-width:480px;margin:16px;padding:24px 22px}
 .score-hero .big{font-size:54px}.stat b,.sum-item b{font-size:22px}.mini-table{font-size:13.5px}
 .rv-card{padding:20px}
}
/* laptop / desktop / landscape: question on the left, palette on the right */
@media (min-width:960px),(min-width:700px) and (orientation:landscape){
 #app{max-width:1240px}
 .quiz-body{display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,30vw,340px);grid-template-rows:auto auto auto auto 1fr;column-gap:20px;align-items:start}
 .quiz-body>.q-meta,.quiz-body>.q-card,.quiz-body>.act-grid{grid-column:1}
 .quiz-body>.side{grid-column:2;grid-row:1 / span 5;position:sticky;top:calc(var(--tb) + var(--tabs) + 14px);max-height:calc(100vh - var(--tb) - var(--tabs) - 28px);max-height:calc(100dvh - var(--tb) - var(--tabs) - 28px);overflow-y:auto}
 .side .palette-wrap{margin-top:0}
}
@media (min-width:960px){
 .q-text{font-size:18px}.opt{font-size:15.5px}
 .quiz-body{padding:20px 28px 0}.sec-tabs{padding:10px 28px}
}
@media (min-width:1000px){
 body{background:#E8EDF4}
 #app{box-shadow:0 0 0 1px var(--line),0 12px 40px rgba(15,42,74,.10)}
}
/* short landscape screens (phones turned sideways) */
@media (max-height:520px) and (orientation:landscape){
 .sec-tabs{position:static}
 .topbar{padding-top:max(7px,env(safe-area-inset-top,0px));padding-bottom:7px}
 .quiz-body>.side{top:calc(var(--tb) + 10px)!important;max-height:calc(100vh - var(--tb) - 20px)!important}
}
</style>
</head>
<body>
<div class="wm-layer" id="wmLayer"></div>
<div id="app">
  <div class="topbar">
    <div class="tb-txt">
      <div class="title">Mock Test 1</div>
      <div class="sub" id="topSub"></div>
    </div>
    <button class="lang-toggle hidden" id="langBtn" onclick="toggleLang()">हिं | EN</button>
    <div class="q-timer hidden" id="timer">15:00</div>
  </div>

  <!-- LANGUAGE -->
  <div class="view" id="view-lang">
    <div class="hero" style="text-align:center;padding:30px 20px">
      <span class="badge">Mock Test 1</span>
      <h1>Percentage / प्रतिशत</h1>
      <div class="tag">Select your language<br>अपनी भाषा चुनें</div>
    </div>
    <div class="lang-card" onclick="setLang('hi')">
      <div class="lang-ico">अ</div>
      <div><b>हिन्दी</b><span>प्रश्न और निर्देश हिन्दी में</span></div>
      <em>▶</em>
    </div>
    <div class="lang-card" onclick="setLang('en')">
      <div class="lang-ico" style="background:#EAF2FF;color:#1F4E78">A</div>
      <div><b>English</b><span>Questions &amp; instructions in English</span></div>
      <em>▶</em>
    </div>
    <p style="text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:16px">You can switch the language anytime during the test.<br>टेस्ट के दौरान कभी भी भाषा बदल सकते हैं।</p>
  </div>

  <!-- INTRO -->
  <div class="view hidden" id="view-intro"></div>

  <!-- TEST -->
  <div id="view-test" class="hidden">
    <div class="sec-tabs" id="secTabs"></div>
    <div class="quiz-body">
      <div class="q-meta">
        <div><div class="q-progress" id="qProg"></div><div class="q-marks"><span class="p">+2</span> / <span class="n">0</span></div></div>
        <button class="flag-chip" id="flagChip" onclick="toggleMark()"></button>
      </div>
      <div class="q-card">
        <div class="q-text" id="qText"></div>
        <div id="qOpts"></div>
        <div class="hint hidden" id="qHint"></div>
      </div>
      <div class="act-grid">
        <button class="abtn a-prev" id="bPrev" onclick="prevQ()"></button>
        <button class="abtn a-skip" id="bSkip" onclick="skipQ()"></button>
        <button class="abtn a-clear" id="bClear" onclick="clearAns()"></button>
      </div>
      <div class="act-grid two">
        <button class="abtn a-mark" id="bMark" onclick="markNext()"></button>
        <button class="abtn a-save" id="bSave" onclick="saveNext()"></button>
      </div>
      <aside class="side"><div class="palette-wrap">
        <h4 id="palTitle"></h4>
        <div id="palette"></div>
        <div class="legend" id="palLegend" style="margin-top:12px"></div>
      </div>
      <button class="submit-btn" id="bSubmit" onclick="openSubmit()"></button></aside>
    </div>
  </div>

  <div class="view hidden" id="view-result"></div>
  <div class="view hidden" id="view-review"></div>
</div>

<div class="modal-bg hidden" id="modal"><div class="modal" id="modalBox"></div></div>

<script>
/* ---------- Language strings ---------- */
var UI={
 hi:{
  chapter:"प्रतिशत", h1:"प्रतिशत (Percentage)", tag:"Quantitative Aptitude",
  questions:"प्रश्न", minutes:"मिनट", totalMarks:"कुल अंक", sections:"सेक्शन", instr:"निर्देश", legendT:"पैलेट संकेत",
  rules:[
   "सही उत्तर पर <b>+2</b> अंक। गलत या अनुत्तरित प्रश्न पर <b>कोई नेगेटिव मार्किंग नहीं</b>।",
   "विकल्प चुनने के बाद <b>Save &amp; Next</b> दबाएँ, तभी उत्तर सेव होगा।",
   "<b>Mark for Review</b> से प्रश्न को बाद में देखने के लिए चिह्नित करें (उत्तर चुना हो तो वह भी गिना जाएगा)।",

/* ---------- Flow ---------- */
function startTest(){
  saved=Array(N).fill(null);draft=Array(N).fill(null);visited=Array(N).fill(false);marked=Array(N).fill(false);
  cur=0;finished=false;endAt=Date.now()+TOTAL_TIME*1000;
  $("timer").classList.remove("hidden");show("view-test");
  go(0);updateTimer();clearInterval(tick);tick=setInterval(updateTimer,1000);
}
function updateTimer(){
  var left=Math.max(0,Math.round((endAt-Date.now())/1000));
  var m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
  var t=$("timer");t.textContent=m+":"+s;t.classList.toggle("low",left<=60);
  if(left<=0&&!finished){toast(T("tTime"));closeModal();finish();}
}
function go(i){if(i<0||i>=N)return;cur=i;visited[i]=true;draft[i]=saved[i];render();}
function render(){
  var q=Q[cur],s=secOf(cur);
  $("qProg").textContent=T("qn")+" "+(cur+1)+" "+T("of")+" "+N;
  $("qText").innerHTML=(q.t?'<span class="pyq">PYQ · '+q.t+'</span>':'')+(cur+1)+". "+q.q[lang];
  $("qOpts").innerHTML=q.o[lang].map(function(t,k){
    return '<div class="opt'+(draft[cur]===k?' selected':'')+'" onclick="pick('+k+')"><span class="opt-letter">'+LET[k]+'</span><span>'+t+'</span></div>';
  }).join("");
  $("flagChip").classList.toggle("on",marked[cur]);
  $("flagChip").textContent=marked[cur]?T("marked"):T("review");
  $("qHint").innerHTML=T("hint");
  $("qHint").classList.toggle("hidden",draft[cur]===saved[cur]);
  $("bPrev").innerHTML=T("prev");$("bSkip").innerHTML=T("skip");$("bClear").innerHTML=T("clear");
  $("bMark").innerHTML=T("mark");$("bSave").innerHTML=T("save");$("bSubmit").textContent=T("submit");
  $("palTitle").textContent=T("palTitle");
  $("palLegend").innerHTML=legendHTML(T("lgNot"),T("lgNoAns2"),T("lgSaved"),T("lgRev"));
  $("secTabs").innerHTML=SECTIONS.map(function(sc,k){
    var a=0;for(var i=sc.start;i<=sc.end;i++){if(saved[i]!==null)a++;}
    return '<button class="sec-tab'+(k===s?' active':'')+'" onclick="go('+sc.start+')"><b>'+sc.name[lang]+' • '+sc.sub[lang]+'</b><span>'+a+' / '+(sc.end-sc.start+1)+' '+T("savedCnt")+'</span></button>';
  }).join("");
  renderPalette();
}
function status(i){
  if(marked[i])return saved[i]!==null?"markans":"mark";
  if(saved[i]!==null)return "ans";
  if(visited[i])return "notans";
  return "";
}
function renderPalette(){
  $("palette").innerHTML=SECTIONS.map(function(sc){
    var b="";for(var i=sc.start;i<=sc.end;i++){b+='<button class="pbtn '+status(i)+(i===cur?' cur':'')+'" onclick="go('+i+')">'+(i+1)+'</button>';}
    return '<div class="psec">'+sc.name[lang]+' — '+sc.sub[lang]+'</div><div class="pgrid">'+b+'</div>';
  }).join("");
}

/* ---------- Actions ---------- */
function pick(k){draft[cur]=k;render();}
function next(){if(cur<N-1)go(cur+1);else{render();toast(T("tLast"));}}
function prevQ(){if(cur>0)go(cur-1);else toast(T("tFirst"));}
function skipQ(){draft[cur]=saved[cur];next();}
function clearAns(){saved[cur]=null;draft[cur]=null;render();}
function saveNext(){
  if(draft[cur]===null){toast(T("tPick"));return;}
  saved[cur]=draft[cur];marked[cur]=false;next();
}
function markNext(){marked[cur]=true;if(draft[cur]!==null)saved[cur]=draft[cur];next();}
function toggleMark(){marked[cur]=!marked[cur];render();}

/* ---------- Submit ---------- */
function counts(){
  var a=0,m=0,nv=0;
  for(var i=0;i<N;i++){if(saved[i]!==null)a++;if(marked[i])m++;if(!visited[i])nv++;}
  return {a:a,m:m,nv:nv,un:N-a};
}

   '<div class="sum-item"><b style="color:var(--green)">'+c.a+'</b><span>'+T("mAns")+'</span></div>'+
   '<div class="sum-item"><b style="color:var(--red)">'+c.un+'</b><span>'+T("mUn")+'</span></div>'+
   '<div class="sum-item"><b style="color:var(--purple)">'+c.m+'</b><span>'+T("mRev")+'</span></div>'+
   '<div class="sum-item"><b>'+c.nv+'</b><span>'+T("mNv")+'</span></div></div>'+
   '<div class="m-row"><button style="background:var(--bg);color:var(--navy)" onclick="closeModal()">'+T("mBack")+'</button>'+
   '<button style="background:var(--red);color:#fff" onclick="closeModal();finish()">'+T("mYes")+'</button></div>';
  $("modal").classList.remove("hidden");
}
function closeModal(){$("modal").classList.add("hidden");}
function finish(){
  if(finished)return;finished=true;clearInterval(tick);
  timeTaken=Math.min(TOTAL_TIME,Math.round((Date.now()-(endAt-TOTAL_TIME*1000))/1000));
  $("timer").classList.add("hidden");
  show("view-result");renderResult();
}
function calc(lo,hi){
  var c=0,w=0,u=0;
  for(var i=lo;i<=hi;i++){if(saved[i]===null)u++;else if(saved[i]===Q[i].a)c++;else w++;}
  return {c:c,w:w,u:u,score:c*POS-w*NEG,att:c+w};
}
function renderResult(){
  var t=calc(0,N-1),max=N*POS;
  var acc=t.att?(t.c/t.att*100):0, pct=t.score/max*100;
  var msg=pct>=80?T("m80"):pct>=50?T("m50"):T("m0");
  var rows=SECTIONS.map(function(sc){var r=calc(sc.start,sc.end),ac=r.att?Math.round(r.c/r.att*100):0;
    return '<tr><td>'+sc.name[lang]+'<br><small style="color:var(--ink-soft)">'+sc.sub[lang]+'</small></td><td>'+r.c+'</td><td>'+r.w+'</td><td>'+r.u+'</td><td><b>'+r.score+'</b></td><td>'+ac+'%</td></tr>';}).join("");
  $("view-result").innerHTML=
   '<div class="score-hero"><div class="lbl">'+T("yourScore")+'</div><div class="big">'+t.score+' <small>/ '+max+'</small></div><div class="msg">'+msg+'</div></div>'+
   '<div class="stat-grid">'+
    '<div class="stat t"><b>'+acc.toFixed(1)+'%</b><span>'+T("accuracy")+'</span></div>'+
    '<div class="stat n"><b>'+t.att+' / '+N+'</b><span>'+T("attempted")+'</span></div>'+
    '<div class="stat a"><b>'+Math.floor(timeTaken/60)+':'+String(timeTaken%60).padStart(2,"0")+'</b><span>'+T("timeTaken")+'</span></div>'+
    '<div class="stat g"><b>'+t.c+'</b><span>'+T("correct")+'</span></div>'+
    '<div class="stat r"><b>'+t.w+'</b><span>'+T("wrong")+'</span></div>'+
    '<div class="stat n"><b>'+t.u+'</b><span>'+T("skipped")+'</span></div>'+
   '</div>'+
   '<div class="card"><h3>'+T("secAnalysis")+'</h3><table class="mini-table"><tr><th>'+T("thSec")+'</th><th>'+T("thC")+'</th><th>'+T("thW")+'</th><th>'+T("thS")+'</th><th>'+T("thM")+'</th><th>Acc.</th></tr>'+rows+'</table>'+
   '<p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px">'+T("accNote")+'</p></div>'+
   '<div class="res-btns"><button class="btn-navy" onclick="openReview(\'all\')">'+T("viewSol")+'</button><button class="btn-teal" onclick="startTest()">'+T("retry")+'</button></div>';
}
function openReview(f){
  rvFilter=f;var list=[];
  for(var i=0;i<N;i++){
    var st=saved[i]===null?"s":(saved[i]===Q[i].a?"c":"w");
    if(f==="all"||f===st)list.push(i);
  }
  var chips=[["all",T("fAll")],["c",T("fC")],["w",T("fW")],["s",T("fS")]].map(function(x){
    return '<button class="fchip'+(f===x[0]?' on':'')+'" onclick="openReview(\''+x[0]+'\')">'+x[1]+'</button>';}).join("");
  var cards=list.map(function(i){
    var q=Q[i],st=saved[i]===null?"s":(saved[i]===q.a?"c":"w");
    var opts=q.o[lang].map(function(t,k){
      var cl="";if(k===q.a)cl=" correct";else if(k===saved[i])cl=" wrong";
      return '<div class="opt static'+cl+'"><span class="opt-letter">'+LET[k]+'</span><span>'+t+'</span></div>';}).join("");
    var tg=st==="c"?'<span class="tagx c">'+T("tagC")+'</span>':st==="w"?'<span class="tagx w">'+T("tagW")+'</span>':'<span class="tagx s">'+T("tagS")+'</span>';
    return '<div class="rv-card"><div class="rv-top"><span>'+T("qn")+' '+(i+1)+' • '+SECTIONS[secOf(i)].name[lang]+'</span>'+tg+'</div>'+
      '<div class="q-text">'+(q.t?'<span class="pyq">PYQ · '+q.t+'</span>':'')+q.q[lang]+'</div>'+opts+(q.e?'<div class="note-box"><b>'+T("expl")+'</b> '+q.e[lang]+'</div>':'')+'</div>';}).join("");
  $("view-review").innerHTML='<h3 style="margin-bottom:10px">'+T("solTitle")+'</h3><div class="filters">'+chips+'</div>'+(cards||'<p style="color:var(--ink-soft)">'+T("none")+'</p>')+
    '<div class="res-btns"><button class="btn-navy" onclick="show(\'view-result\');renderResult()">'+T("backRes")+'</button><button class="btn-teal" onclick="startTest()">'+T("retry")+'</button></div>';
  show("view-review");
}
</script>
</body>
</html>
